interface:
  display_name: "Large Task Orchestrator"
  short_description: "按 Story 难度选择 Worker，用廉价 Validator 确认完成并持续执行计划"
  default_prompt: "Use $large-task-orchestrator to drive this plan with native worker subagents and an economy validator until delivery or a genuine blocker. Pick the worker capability class from Story difficulty. Dispatch the validator with $story-direction-review to check that the story is actually complete; do not run a code review."
policy:
  allow_implicit_invocation: false
