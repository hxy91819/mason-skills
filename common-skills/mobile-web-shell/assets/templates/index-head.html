<!-- 放进 index.html 的 <head>。替换 __TOKEN__ 后删除本注释。 -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
<!-- 默认值与首屏背景一致；运行时由应用层按当前页顶部颜色更新。 -->
<meta name="theme-color" content="__THEME_COLOR__" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="__APP_SHORT_NAME__" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="__MANIFEST_HREF__" />
<link rel="apple-touch-icon" sizes="180x180" href="__APPLE_TOUCH_ICON__" />

<!-- 启动图按“逻辑分辨率 × 像素比”提供；新增机型时图片和 media 条件同时补齐。 -->
