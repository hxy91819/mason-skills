interface:
  display_name: "BB Steward"
  short_description: "Drive a goal across sessions as a steward: plan, dispatch via BB, maintain the workbook"
  default_prompt: "Use $bb-steward to drive this goal: read or create the workbook, decide the next step, dispatch via bb-model-routing, and after notifications write back the route, key decisions and user to-dos."
policy:
  allow_implicit_invocation: false
