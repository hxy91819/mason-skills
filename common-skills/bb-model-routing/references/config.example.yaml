version: 2
# Optional: override permissions globally; when omitted, Codex supporting auto defaults to auto, others default to accept-edits.
# permission_mode: accept-edits
# Hand-edit this switch to control whether dispatch passes --service-tier fast; defaults to false when omitted.
# The script has no command-line override. When the model does not support fast it still dispatches, just without that parameter.
fast: false
# Optional: force Fast on and exempt it from the patrol automatic circuit breaker (use when quota is about to reset or for a temporary burst; can also be set in agents.<alias>.force_fast)
# force_fast: true
# Optional: custom Fast breaker threshold and automatic restore time (e.g. temporarily break at 95% used, automatically restoring the default 60% used / 40% remaining on expiry)
# quota_fuse:
#   used_threshold_percent: 95.0
#   restore_at: '2026-10-30T12:00:00+08:00'
#   default_used_threshold_percent: 60.0
# defaults only selects provider aliases; model and reasoning level are defined in agents.<alias>.routes.
# A value can be an ordered alias list as a same-tier fallback chain, e.g. simple: [primary, backup].
# Equal-weight load balancing:{mode: load-balance, candidates: [primary, backup]}
# Weighted load balancing:
# simple:
#   mode: weighted-load-balance
#   candidates: {primary: 2, backup: 1}
# Each candidate resolves its own routes by this route entry; switching candidates changes only the provider, not the tier.
defaults:
  simple: primary
  medium: primary
  complex: primary
agents:
  primary:
    provider: <provider-id>
    # Optional: override this account's permission; auto is recommended for Codex, other accounts keep their own permissions.
    # permission_mode: auto
    # Optional: hand-edit this switch to control individually whether this account passes --service-tier fast; inherits top-level fast when omitted.
    # fast: true
    # Optional: title prefix icon shape, supports circle (default), square, heart; when omitted it is mapped automatically from the alias.
    # shape: circle
    # Optional: concurrency cap for this provider shared across models, difficulties, and dispatch processes; unlimited when omitted.
    # max_concurrency: 1
    # Optional: only the listed models share the cap together; unlisted models are unlimited. Requires max_concurrency too.
    # concurrency_models: [<medium-model-id>, <complex-model-id>]
    routes:
      simple:
        model: <simple-model-id>
        reasoning: <simple-reasoning-level>
      medium:
        model: <medium-model-id>
        reasoning: <medium-reasoning-level>
      complex:
        model: <complex-model-id>
        reasoning: <complex-reasoning-level>
      # default explicitly lets this agent accept all route entries not configured individually.
      default:
        model: <fallback-model-id>
# Optional: set a minimum difficulty per BB project ID; unconfigured projects keep the requested difficulty.
projects: {}
# projects:
#   <project-id>:
#     min_difficulty: medium  # simple / medium / complex
environments: {}
# Environment IDs come from bb; same-named aliases are replaced wholesale and do not inherit top-level routes.
# environments:
#   <environment-id>:
#     defaults: {complex: specialist}
#     agents:
#       specialist:
#         provider: <provider-id>
#         routes:
#           complex: {model: <model-id>, reasoning: <reasoning-level>}
