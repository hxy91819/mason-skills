version: 2
permission_mode: accept-edits
# 人手改这个开关控制派发是否带 --service-tier fast；省略时默认 true。
# 脚本没有命令行覆盖。模型不支持 fast 时仍派发，只是不带该参数。
fast: true
# defaults 只选择 provider 别名；模型与推理级别在 agents.<别名>.routes 中定义。
# 值可为有序别名列表作同档 fallback 链，如 simple: [primary, backup]。
# 等权负载均衡：{mode: load-balance, candidates: [primary, backup]}
# 加权负载均衡：
# simple:
#   mode: weighted-load-balance
#   candidates: {primary: 2, backup: 1}
# 每个候选按本次路由项解析自己的 routes，切换候选只换 provider 不换档位。
defaults:
  simple: primary
  medium: primary
  complex: primary
agents:
  primary:
    provider: <provider-id>
    # 可选：标题前缀图标形状，支持 circle（圆，默认）、square（方）、heart（心）；省略时按别名自动映射。
    # shape: circle
    # 可选：此 provider 跨模型、难度和派发进程共享的并发上限；省略则不限制。
    # max_concurrency: 1
    # 可选：只让列出的模型合计共用上限；列表外模型不限制。需同时配置 max_concurrency。
    # concurrency_models: [<medium-model-id>, <complex-model-id>]
    routes:
      simple:
        model: <simple-model-id>
        reasoning: <simple-reasoning-level>
      medium:
        model: <medium-model-id>
        reasoning: <medium-reasoning-level>
      complex:
        model: <complex-model-id>
        reasoning: <complex-reasoning-level>
      # default 显式允许该 agent 接受所有未单独配置的路由项。
      default:
        model: <fallback-model-id>
environments: {}
# 环境 ID 来自 bb；同名别名整体替换，不继承顶层 routes。
# environments:
#   <environment-id>:
#     defaults: {complex: specialist}
#     agents:
#       specialist:
#         provider: <provider-id>
#         routes:
#           complex: {model: <model-id>, reasoning: <reasoning-level>}
