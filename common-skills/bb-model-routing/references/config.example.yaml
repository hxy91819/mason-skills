version: 1
permission_mode: accept-edits
# 别名是用户自定义标签；可先让所有任务共用一个已验证的路由。
defaults:
  simple: primary
  medium: primary
  complex: primary
  debug: primary
  test: primary
  # 可选：为编排异常裁决单独选模型/推理级别；省略时沿用 complex。
  judge: primary
agents:
  primary:
    provider: <provider-id>
    model: <model-id>
    # 可选：从该模型目录选择支持的值；省略时使用 provider 默认值。
    # reasoning: <reasoning-level>
    # 也可按难度配置：{simple: <level>, medium: <level>, complex: <level>}
environments: {}
# 环境 ID 来自 bb；同名别名整体替换，不继承顶层的模型设置。
# environments:
#   <environment-id>:
#     defaults: {complex: specialist, debug: specialist}
#     agents:
#       specialist:
#         provider: <provider-id>
#         model: <model-id>
