interface:
  display_name: "PPT Visual Review"
  short_description: "布局验收：subagent 审查箭头、留白、同类一致性、全局字体颜色与中文排版细节，主 Agent 修复并循环复审至 clean，输出整体前后对比 HTML 报告"
  default_prompt: "Use $ppt-visual-review to have a subagent review slide layout (arrows, whitespace, same-type consistency, global fonts and colors), fix the findings, re-review until clean, and deliver a whole-deck before/after HTML report using $review-html-report."

policy:
  allow_implicit_invocation: false
